# Lint and tests on every push. Based on the workflow `bench new-app` writes
# (Frappe 16, frappe/utils/boilerplate.py), with Frappe and ERPNext on version-16.
# A second job runs dz_cod's tests on this dz_core (dafter-cod at the branch or
# tag of the same name, else main), so a change here that breaks the app on
# top fails here; and the whole runs weekly against Frappe's and ERPNext's
# version-16 branches (review of 27 October 2026, 5.2 and 5.3).
name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pre-commit/action@v3.0.1

  tests:
    name: Tests (dz_core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: MariaDB client and wkhtmltopdf (PDFs of the closing file and archive)
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client wkhtmltopdf

      - name: Bench with Frappe and ERPNext 16
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --skip-assets --branch version-16 erpnext
          bench get-app --skip-assets dz_core "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench build

      - name: Test site (ERPNext + dz_core)
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext dz_core
          bench --site test_site set-config allow_tests true

      - name: dz_core tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app dz_core

  tests-with-dz-cod:
    name: Tests (dz_cod on this dz_core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: MariaDB client and wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client wkhtmltopdf

      - name: Bench with Frappe, ERPNext 16, this dz_core and dafter-cod
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          COD=main
          if git ls-remote --exit-code --heads --tags https://github.com/adem-max/dafter-cod "$BRANCH" > /dev/null; then COD="$BRANCH"; fi
          echo "dafter-cod at $COD"
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --skip-assets --branch version-16 erpnext
          bench get-app --skip-assets dz_core "$GITHUB_WORKSPACE"
          bench get-app --skip-assets --branch "$COD" https://github.com/adem-max/dafter-cod
          bench setup requirements --dev
          bench build

      - name: Test site (ERPNext + dz_core + dz_cod)
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext dz_cod
          bench --site test_site set-config allow_tests true

      - name: dz_cod tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app dz_cod
